<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <!-- Connect external CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main container -->
    <div class="container">

        <h1>Student Grade Calculator</h1>

        <p class="subtitle">
            Enter marks for five subjects
        </p>

        <!-- Student name -->
        <div class="input-group">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName"
                   placeholder="Enter student name">
        </div>

        <!-- Subject 1 -->
        <div class="input-group">
            <label for="sub1">Subject 1</label>
            <input type="number" id="sub1"
                   min="0" max="100"
                   placeholder="Enter marks">
        </div>

        <!-- Subject 2 -->
        <div class="input-group">
            <label for="sub2">Subject 2</label>
            <input type="number" id="sub2"
                   min="0" max="100"
                   placeholder="Enter marks">
        </div>

        <!-- Subject 3 -->
        <div class="input-group">
            <label for="sub3">Subject 3</label>
            <input type="number" id="sub3"
                   min="0" max="100"
                   placeholder="Enter marks">
        </div>

        <!-- Subject 4 -->
        <div class="input-group">
            <label for="sub4">Subject 4</label>
            <input type="number" id="sub4"
                   min="0" max="100"
                   placeholder="Enter marks">
        </div>

        <!-- Subject 5 -->
        <div class="input-group">
            <label for="sub5">Subject 5</label>
            <input type="number" id="sub5"
                   min="0" max="100"
                   placeholder="Enter marks">
        </div>

        <!-- Calculate button -->
        <button onclick="calculateGrade()">
            Calculate Result
        </button>

        <!-- Reset button -->
        <button class="reset-btn" onclick="resetForm()">
            Reset
        </button>

        <!-- Result will appear here -->
        <div id="result"></div>

    </div>

    <!-- Connect external JavaScript -->
    <script src="script.js"></script>

</body>

</html>
